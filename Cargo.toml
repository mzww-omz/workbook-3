[package]
name = "workbook3"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Workbook 3 - a concise, AI-ready study workbook for desktop"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
fsrs = "6.6.2"
gpui = "0.2.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
